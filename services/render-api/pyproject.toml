[project]
name = "gravitas-render-api"
version = "0.1.0"
description = "Render job API for Gravitas."
requires-python = ">=3.12"
dependencies = [
  "azure-storage-blob>=12.24,<13",
  "azure-storage-queue>=12.12,<13",
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<1",
  "azure-storage-blob>=12.24,<13",
  "azure-storage-queue>=12.12,<13",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
