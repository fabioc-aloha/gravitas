[project]
name = "gravitas-render-worker"
version = "0.1.0"
description = "CPU reference rasterizer for Gravitas."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "pillow>=10,<12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

